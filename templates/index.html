<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Source RAG Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Sidebar for Inputs -->
        <div class="sidebar">
            <h2>Multi-Source RAG</h2>
            <p class="subtitle">Select source & ingest data</p>

            <!-- Mode Selector Tabs -->
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('youtube')">YouTube</button>
                <button class="tab-btn" onclick="switchTab('pdf')">PDF</button>
                <button class="tab-btn" onclick="switchTab('web')">Website</button>
            </div>

            <!-- YouTube Section -->
            <div id="youtube-section" class="input-section active">
                <label>YouTube Video ID:</label>
                <input type="text" id="youtube-id" placeholder="e.g. dQw4w9WgXcQ">
                <button onclick="processYouTube()">Process YouTube</button>
            </div>

            <!-- PDF Section -->
            <div id="pdf-section" class="input-section" style="display: none;">
                <label>Upload PDF Document:</label>
                <input type="file" id="pdf-file" accept=".pdf">
                <button onclick="processPDF()">Process PDF</button>
            </div>

            <!-- Web Section -->
            <div id="web-section" class="input-section" style="display: none;">
                <label>Website URL:</label>
                <input type="text" id="web-url" placeholder="https://example.com">
                <button onclick="processWeb()">Process Website</button>
            </div>

            <div id="status-message" class="status-msg"></div>
        </div>

        <!-- Chat Main Area -->
        <div class="chat-container">
            <div class="chat-header">
                <h3>Chat Assistant</h3>
                <span id="active-source-badge">No data loaded yet</span>
            </div>

            <div class="chat-box" id="chat-box">
                <div class="message bot-msg">
                    Hello! Ingest data from the left panel (YouTube, PDF, or Website) to start chatting.
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="user-query" placeholder="Ask anything about the ingested content..." onkeypress="handleKeyPress(event)">
                <button onclick="sendQuery()">Send</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
